name: Sync OWL pages
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-owl
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install html5lib==1.1
      - run: python tools/sync-owl.py
      - name: Publish updated pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- owl/index.html owl/builder.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh published OWL pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          # A push made with GITHUB_TOKEN needs an explicit branch Pages build.
          # Recheck on subsequent runs so a failed build request can be retried.
          build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
          if ! jq -e --arg sha "$(git rev-parse HEAD)" \
            '.commit == $sha and (.status == "built" or .status == "building" or .status == "queued")' \
            <<<"$build" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
